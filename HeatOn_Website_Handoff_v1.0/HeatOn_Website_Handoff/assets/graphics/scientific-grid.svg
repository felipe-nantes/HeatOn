<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="2400" height="1600" viewBox="0 0 2400 1600"
     role="img" aria-label="HeatOn Scientific Grid">
  <defs>
    <!-- Minor scientific grid -->
    <pattern id="minorGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"
            fill="none"
            stroke="#8A8F98"
            stroke-width="1"
            stroke-opacity="0.18"/>
    </pattern>

    <!-- Major measurement grid -->
    <pattern id="majorGrid" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="url(#minorGrid)"/>
      <path d="M 200 0 L 0 0 0 200"
            fill="none"
            stroke="#61D4E8"
            stroke-width="1.6"
            stroke-opacity="0.28"/>
    </pattern>
  </defs>

  <!-- Transparent background; only grid geometry is drawn -->
  <rect x="0" y="0" width="2400" height="1600" fill="url(#majorGrid)"/>
</svg>
